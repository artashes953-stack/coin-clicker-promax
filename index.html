<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin clicker+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="startscreen">
    <p id="p">🪙Coin clicker loading...</p>
</div>
<div id="boss">
    <div id="game">
        <div id="dzax">
        <div id="header">
            <img src="../kpekuneq.png" id="Kopek" alt="">
            <p id="coinsp">Coins: 0</p>
            <p id="rebp">Rebirths: 0</p>
            <p id="powp">Power: 1</p>
            <p id="clicksp">Clicks: 0</p>
        </div>
        <button id="click">🪙</button>
        <button id="rebtn">🔄</button>
        </div>
        <div id="mejtex">
            <p id="panp" style="font-size: 4rem;">Panel🛠️𓊈𒆜OWNER𒆜𓊉</p>
            <div id="panel">
                <input type="number" placeholder="Coins" id="coininp">
                <button id="addcoins">Add Coins</button>
                <button id="setcoins">Setcoins</button>
<br><br><br>

                <input type="number" placeholder="power" id="powerinp">
                <button id="addpower">Add Power</button>
                <button id="setpower">Set power</button>
            </div>
        </div>
        <div id="camera">
            <h1 id="titcam">Camera📸</h1>
            <video id="cmo" autoplay></video>
            <button id="bordon">Border ON🟢</button>
            <button id="bordof">Border OFF🔴</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
